- name: Project board
  group: web
  kind: Separates project phases from deployed versions
  stack: [React 19, TypeScript, Cloudflare Workers, D1]
  featured: { order: 3, area: Backend and web }
  source: private
  problem: A kanban card can say "testing", but it cannot say that 1.4 is in testing while 1.3 runs in production.
  approach: Projects move through custom columns while their target, test and production versions are tracked separately. Board content is encrypted with AES-256-GCM, sign-in uses a GitHub App with OAuth PKCE, and agents get scoped, expiring API tokens that never exceed their creator's permissions.
  result: Live, with private source. A public workflow checks the app daily for health, security headers and a 401 on anonymous board access, and anyone can repeat the check with curl.
  as_of: Sep 2026
  links:
    - { label: Live app, href: 'https://project-board.majkeylab.workers.dev' }
    - { label: Showcase, href: 'https://github.com/Majkey25/project-board-showcase' }

- name: RC Audio Lab
  group: web
  kind: An RC filter you can hear
  stack: [TypeScript, React 19, Web Audio, Vite]
  featured: { order: 4, area: Backend and web }
  problem: A credit project for Tomas Bata University in Zlín, to make capacitor charging and first-order filters something you can see and hear.
  approach: The filter runs in an AudioWorklet with bilinear-transform coefficients prewarped at the cutoff. The equations update with the substituted values, and you can switch A/B on a recorded guitar riff.
  result: Playwright tests in Chromium and Firefox render the production audio processor offline and compare the measured amplitude and phase with the maths; the default high-pass must cut the test recording by more than 20 dB.
  as_of: Sep 2026
  links:
    - { label: Open the lab, href: 'https://majkey25.github.io/rc-audio-lab/' }
    - { label: Repository, href: 'https://github.com/Majkey25/rc-audio-lab' }

