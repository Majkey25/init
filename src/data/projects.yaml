- name: SeliaScan
  formerly: ScanIt
  group: android
  kind: Scan, save, share
  stack: [Kotlin, Jetpack Compose, ML Kit]
  featured: { order: 6, area: Android apps }
  problem: Scanning a document on Android should not need an account, ads or a file manager.
  approach: Google's ML Kit document scanner handles capture. On-device OCR, redaction burned into a protected revision, reusable signatures and stamps, and orientation fixes applied only when the angle of the text lines gives reliable evidence.
  result: Version 1.8.2 for Android 10 and newer, MIT-licensed on GitHub with every feature unlocked, no Internet permission of its own, five interface languages.
  as_of: Sep 2026
  links:
    - { label: Project page, href: 'https://majkey25.github.io/ScanIt/' }
    - { label: Repository, href: 'https://github.com/Majkey25/ScanIt' }

- name: Selia Weather
  group: android
  kind: A forecast that names its sources
  stack: [Kotlin, Jetpack Compose]
  featured: { order: 7, area: Android apps }
  problem: Weather models disagree and a single forecast hides it. Czech users also expect ČHMÚ data.
  approach: The app requests several model families and computes a robust median on the device when at least three values exist. It adds ČHMÚ ALADIN for Czech locations, observed radar, DWD ICON maps and a five-year NASA POWER archive, and the details screen lists which models contributed.
  result: In a 313-case temperature replay the median had a lower pooled error than Open-Meteo Best Match. The report keeps the station-level failures, and the app makes no claim of superior accuracy.
  as_of: Sep 2026
  links:
    - { label: Project page, href: 'https://majkey25.github.io/Selia-Weather/' }
    - { label: Repository, href: 'https://github.com/Majkey25/Selia-Weather' }

- name: Intoniva
  formerly: TuneItAll
  group: android
  kind: Offline instrument tuner
  stack: [Kotlin, Jetpack Compose, audio DSP]
  featured: { order: 8, area: Android apps }
  problem: A tuner should open on the tuner, without an account, ads or network.
  approach: Auto, manual and chromatic modes, presets for guitars, basses, ukulele and the violin family, an adjustable A4 reference, on-device tempo detection and chord analysis of local audio files. Feedback rejection stops the in-tune chime from re-triggering detection.
  result: Free on Google Play with every feature included and no network permission at all.
  as_of: Sep 2026
  links:
    - {
        label: Google Play,
        href: 'https://play.google.com/store/apps/details?id=com.tuneitall.tuner',
      }
