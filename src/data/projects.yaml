- name: Project-Guard
  group: tools
  kind: GitHub project audit
  stack: [Python, Streamlit, LLM tool calling]
  featured: { order: 2, area: AI and language }
  problem: '"Which items are missing the fields or links my team expects?" asked across issues, pull requests and Project V2 boards.'
  approach: A local Streamlit app and HTTP API check issues, pull requests and branches against rules you configure. An optional LLM assistant with tool calling explains the gaps and prepares field values you review before they apply.
  result: Runs entirely on your machine, without telemetry, and exports a self-contained offline HTML report. CI enforces Pyright strict, Ruff and pytest. The same audit engine now runs inside Project board.
  as_of: Jul 2026
  links:
    - { label: Repository, href: 'https://github.com/Majkey25/Project-Guard' }

